plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // QA client: joins a server on localhost:25565 straight away (see tools/qa/).
        qaClient {
            client()
            setConfigName('Fabric QA Client')
            ideConfigGenerated(false)
            runDir('runs/client')
            programArgs('--quickPlayMultiplayer', 'localhost:25565', '--username', 'LootGoblin', '--width', '1920', '--height', '1080')
        }
    }
}

// Development-only reel capture client (tools/reel): ./gradlew :fabric:runReelClient -PreelDirector
if (providers.gradleProperty('reelDirector').isPresent()) {
    sourceSets {
        reelDirector {
            java.srcDir(rootProject.file('../tools/reel/src/v1211/java'))
            resources.srcDir(rootProject.file('../tools/reel/src/v1211/resources'))
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            mob_loot_bags { sourceSet sourceSets.main }
            reel_director { sourceSet sourceSets.reelDirector }
        }
        runs {
            reelClient {
                client()
                source sourceSets.reelDirector
                setConfigName('Mob Loot Bags Reel Director')
                ideConfigGenerated(false)
                runDir('runs/reel')
                programArgs '--width', providers.gradleProperty('reelWidth').getOrElse('1080'),
                        '--height', providers.gradleProperty('reelHeight').getOrElse('1920'), '--username', 'LootGoblin'
                vmArgs '-Xmx6G'
            }
        }
    }
}
