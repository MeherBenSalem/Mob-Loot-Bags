# Compile every Minecraft workspace on each push and pull request, so a
# change is known to build before it is merged or published.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.20.1", "1.21.1", "26.1.2", "26.2", "26.3"]
    name: build (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
