# Publish Mob Loot Bags to Modrinth + CurseForge (NightBeam convention).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/mob_loot_bags-<loader>-<minecraft>-<version>.jar committed to the repo,
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge.
# Each jar is tagged with its own Minecraft version and loader (1.20.1 Forge is CurseForge loader 7498, never
# NeoForge); Fabric jars declare Fabric API as a required dependency on both sites.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on Modrinth, CurseForge or an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Repo variables: MODRINTH_ID, CURSEFORGE_ID
#
# Prove it first:  gh workflow run publish.yml -f version=2.0.3 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=2.0.3   (or: git tag v2.0.3 && git push origin v2.0.3)

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging; matches jar names / GitHub Release
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both (the same-day guard still applies)"
        required: false
        default: "both"
      minecraft_version:
        description: "Optional: upload only this Minecraft version's jars (1.20.1, 1.21.1, 26.2 or 26.3); the same-day guard still applies"
        required: false

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=${VERSION_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: |
          node --test scripts/*.test.mjs
          node .github/scripts/detect-jar-meta.test.js

      - name: Same-day guard
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else for this version is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'mob_loot_bags-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_targets.py workspaces
          ws_version="$(python3 scripts/check_targets.py version)"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::The workspaces are at ${ws_version}, not ${VERSION}. Bump them first (./gradlew syncVersion -PmodVersion=${VERSION})."
            exit 1
          fi
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file jar-list.txt
          mapfile -t JARS < jar-list.txt
          if [ -n "$MC_FILTER" ]; then
            case "$MC_FILTER" in
              1.20.1|1.21.1|26.2|26.3) ;;
              *) echo "::error::minecraft_version must be 1.20.1, 1.21.1, 26.2 or 26.3, not ${MC_FILTER}"; exit 1 ;;
            esac
            FILTERED=()
            for jar in "${JARS[@]}"; do
              if [[ "$(basename "$jar")" == mob_loot_bags-*-"${MC_FILTER}"-"${VERSION}".jar ]]; then
                FILTERED+=("$jar")
              fi
            done
            JARS=("${FILTERED[@]}")
            echo "Uploading only Minecraft ${MC_FILTER}:"
          fi
          for jar in "${JARS[@]}"; do
            printf '%s -> %s\n' "$jar" "$(node .github/scripts/detect-jar-meta.js "$jar")"
          done
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          CHANGELOG_FILE: PATCH_NOTES.md
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { detectRequired, LOADER_IDS } = require('./.github/scripts/detect-jar-meta.js');
          const version = process.env.VERSION;
          const platforms = (process.env.PLATFORMS || 'both').toLowerCase();
          if (!['both', 'modrinth', 'curseforge'].includes(platforms)) throw new Error('platforms must be modrinth, curseforge or both');
          const doModrinth = platforms === 'both' || platforms === 'modrinth';
          const doCurse = platforms === 'both' || platforms === 'curseforge';
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          if (!jars.length) throw new Error('No jars to upload');

          // The NightBeam convention targets: 1.20.1 is Fabric + Forge, every other line Fabric + NeoForge.
          const ALLOWED = {
            '1.20.1': ['fabric', 'forge'],
            '1.21.1': ['fabric', 'neoforge'],
            '26.2': ['fabric', 'neoforge'],
            '26.3': ['fabric', 'neoforge'],
          };
          const parsed = jars.map((jar) => {
            // Must parse MC from filename; never default (a calendar version was once mis-tagged as 1.21.1).
            const { loader, gv } = detectRequired(jar);
            if (!(ALLOWED[gv] || []).includes(loader)) {
              throw new Error(`${path.basename(jar)}: ${loader} on Minecraft ${gv} is not a supported target`);
            }
            return { jar, name: path.basename(jar), loader, gv };
          });

          // Fabric builds need Fabric API (Modrinth project P7dR8mSH, CurseForge slug fabric-api).
          const modrinthDeps = (p) => (p.loader === 'fabric' ? [{ project_id: 'P7dR8mSH', dependency_type: 'required' }] : []);
          const curseforgeRelations = (p) => (p.loader === 'fabric' ? { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] } : undefined);

          let changelog = `Release ${version}`;
          // Prefer this version's own notes (patchnotes/<version>.md) over the full history.
          const versionNotes = path.join('patchnotes', `${version}.md`);
          if (fs.existsSync(versionNotes)) {
            changelog = fs.readFileSync(versionNotes, 'utf8');
          } else if (process.env.CHANGELOG_FILE && fs.existsSync(process.env.CHANGELOG_FILE)) {
            changelog = fs.readFileSync(process.env.CHANGELOG_FILE, 'utf8');
          }

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry && (entry.id != null) && entry.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            const loose = flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return loose?.id;
          }

          (async () => {
            if (doModrinth) {
              for (const p of parsed) {
                const body = {
                  name: `${version} ${p.loader} ${p.gv}`,
                  version_number: `${version}+${p.loader}-${p.gv}`,
                  changelog,
                  dependencies: modrinthDeps(p),
                  game_versions: [p.gv],
                  version_type: 'release',
                  loaders: [p.loader],
                  featured: false,
                  status: 'listed',
                  project_id: process.env.MODRINTH_ID,
                  file_parts: ['file_0'],
                  primary_file: 'file_0',
                };
                const form = new FormData();
                form.append('data', JSON.stringify(body));
                form.append('file_0', new Blob([fs.readFileSync(p.jar)]), p.name);
                const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                  method: 'POST',
                  headers: { Authorization: process.env.MODRINTH_TOKEN },
                  body: form,
                });
                const mrText = await mrRes.text();
                if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + p.name + ' ' + mrText.slice(0, 500));
                console.log('Modrinth OK', p.name, 'game=' + p.gv, 'loader=' + p.loader, mrText.slice(0, 180));
              }
            } else {
              console.log('Skipping Modrinth (platforms=' + platforms + ')');
            }

            if (!doCurse) {
              console.log('Skipping CurseForge (platforms=' + platforms + ')');
              return;
            }

            // Prefer Upload API game/versions (matches upload token), fallback to CF Core API
            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) {
              flat = flattenVersions(await uploadGv.json());
              console.log('CurseForge versions via upload API:', flat.length);
            } else {
              console.warn('Upload game/versions failed', uploadGv.status, (await uploadGv.text()).slice(0, 200));
            }
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              const gvText = await gvRes.text();
              if (!gvRes.ok) throw new Error('CurseForge versions ' + gvRes.status + ' ' + gvText.slice(0, 300));
              flat = flattenVersions(JSON.parse(gvText));
              console.log('CurseForge versions via core API:', flat.length);
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            let uploaded = 0;
            for (const p of parsed) {
              const mcId = findVersionId(flat, p.gv);
              // Loader tags are fixed CurseForge ids: Fabric 7499, Forge 7498 (1.20.1), NeoForge 10150.
              const loaderId = LOADER_IDS[p.loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) {
                throw new Error('No CurseForge game version id for ' + p.gv + ' (' + p.name + ')');
              }
              if (loaderId == null) {
                throw new Error('No CurseForge loader id for ' + p.loader);
              }
              const gameVersions = [mcId, loaderId];
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              // Fallback for APIs that accept names for the environment group
              const gameVersionNames = [];
              if (clientId == null) gameVersionNames.push('Client');
              if (serverId == null) gameVersionNames.push('Server');
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: p.name,
                gameVersions,
                releaseType: 'release',
              };
              if (gameVersionNames.length) meta.gameVersionNames = gameVersionNames;
              const relations = curseforgeRelations(p);
              if (relations) meta.relations = relations;
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(p.jar)]), p.name);
              let cfText = '';
              for (let attempt = 1; attempt <= 4; attempt++) {
                const cfRes = await fetch(
                  `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                  { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
                );
                cfText = await cfRes.text();
                if (cfRes.ok) break;
                if ((cfRes.status === 503 || cfRes.status === 429) && attempt < 4) {
                  console.warn('CurseForge', cfRes.status, 'for', p.name, '- retry', attempt);
                  await new Promise((r) => setTimeout(r, 15000 * attempt));
                  continue;
                }
                throw new Error('CurseForge ' + cfRes.status + ' ' + p.name + ' ' + cfText.slice(0, 500));
              }
              console.log('CurseForge OK', p.name, 'game=' + p.gv, 'loader=' + p.loader + ' (' + loaderId + ')', cfText.slice(0, 180));
              uploaded += 1;
            }
            console.log('CurseForge uploaded', uploaded, 'file(s) to project', process.env.CURSEFORGE_ID);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
