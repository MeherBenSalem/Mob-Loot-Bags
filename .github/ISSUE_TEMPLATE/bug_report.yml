name: Bug report
description: Report a problem with Mob Loot Bags
labels: ["bug"]
body:
  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft version
      options:
        - "1.20.1"
        - "1.21.1"
        - "26.1.2"
        - Other
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
        - Other
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: e.g. 1.11.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: Paste relevant log excerpts if available.
